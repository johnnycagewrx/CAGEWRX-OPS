<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>CAGEWRX OPS - Production</title>
  <meta name="theme-color" content="#060e18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CAGEWRX OPS">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon.png">
  <link rel="stylesheet" href="css/main.css?v=1782237764">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/production.css?v=1782237770">
</head>
<body>

<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="app-content">

<!-- ===== HEADER ===== -->
<div id="header-mount"></div>

<!-- ===== MAIN ===== -->
<div class="prod-main">

  <!-- Welcome message -->
  <div class="welcome-bar" id="welcome-bar" style="display:none;">
    <span id="welcome-msg"></span>
  </div>

  <!-- Assignee filter -->
  <div class="assignee-filter-bar">
    <div id="assignee-filter-wrap" style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;"></div>
  </div>

  <div class="prod-pipeline">

    <!-- Shipping -->
    <div class="prod-stage" id="pstage-shipping"
      ondragover="onTaskDragOver(event,'shipping')"
      ondragleave="onTaskDragLeave('shipping')"
      ondrop="onTaskDrop(event,'shipping')">
      <div class="prod-stage-header" style="background:#0a1a1a;" onclick="toggleProdSection('shipping')">
        <span style="font-size:15px;">&#x1F4E6;</span>
        <p class="prod-stage-title" style="color:#4db6ac;">SHIPPING</p>
        <span class="prod-stage-count" id="pcnt-shipping" style="background:#0f2a2a;color:#4db6ac;">-</span>
        <span class="prod-stage-chevron" id="pchv-shipping">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="pcol-shipping">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Shop -->
    <div class="prod-stage" id="pstage-shop"
      ondragover="onTaskDragOver(event,'shop')"
      ondragleave="onTaskDragLeave('shop')"
      ondrop="onTaskDrop(event,'shop')">
      <div class="prod-stage-header" style="background:#1a1000;" onclick="toggleProdSection('shop')">
        <span style="font-size:15px;">&#x1F527;</span>
        <p class="prod-stage-title" style="color:#ffa726;">SHOP</p>
        <span class="prod-stage-count" id="pcnt-shop" style="background:#2a1a00;color:#ffa726;">-</span>
        <span class="prod-stage-chevron" id="pchv-shop">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="pcol-shop">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Sales/Marketing/Engineering -->
    <div class="prod-stage" id="pstage-sme"
      ondragover="onTaskDragOver(event,'sme')"
      ondragleave="onTaskDragLeave('sme')"
      ondrop="onTaskDrop(event,'sme')">
      <div class="prod-stage-header" style="background:#0a1525;" onclick="toggleProdSection('sme')">
        <span style="font-size:15px;">&#x1F4C8;</span>
        <p class="prod-stage-title" style="color:#42a5f5;">SALES / MARKETING</p>
        <span class="prod-stage-count" id="pcnt-sme" style="background:#0f1f35;color:#42a5f5;">-</span>
        <span class="prod-stage-chevron" id="pchv-sme">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="pcol-sme">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Engineering -->
    <div class="prod-stage" id="pstage-engineering"
      ondragover="onTaskDragOver(event,'engineering')"
      ondragleave="onTaskDragLeave('engineering')"
      ondrop="onTaskDrop(event,'engineering')">
      <div class="prod-stage-header" style="background:#0a0a1a;" onclick="toggleProdSection('engineering')">
        <span style="font-size:15px;">&#x2699;</span>
        <p class="prod-stage-title" style="color:#9c27b0;">ENGINEERING</p>
        <span class="prod-stage-count" id="pcnt-engineering" style="background:#1a0a2a;color:#9c27b0;">-</span>
        <span class="prod-stage-chevron" id="pchv-engineering">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="pcol-engineering">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Need to Make -->
    <div class="prod-stage" id="pstage-needtomake"
      ondragover="onTaskDragOver(event,'needtomake')"
      ondragleave="onTaskDragLeave('needtomake')"
      ondrop="onTaskDrop(event,'needtomake')">
      <div class="prod-stage-header" style="background:#1a0808;" onclick="toggleProdSection('needtomake')">
        <span style="font-size:15px;">&#x1F6E0;</span>
        <p class="prod-stage-title" style="color:#ef5350;">NEED TO MAKE</p>
        <span class="prod-stage-count" id="pcnt-needtomake" style="background:#2a0f0f;color:#ef5350;">-</span>
        <span class="prod-stage-chevron" id="pchv-needtomake">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="pcol-needtomake">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

  </div><!-- end .prod-pipeline -->

  <!-- Low Stock (Shopify) -->
  <div class="prod-stage" id="pstage-lowstock" style="margin-top:14px;">
    <div class="prod-stage-header" style="background:#1a1500;cursor:pointer;" onclick="toggleLowStockSection()">
      <span style="font-size:15px;">&#x26A0;</span>
      <p class="prod-stage-title" style="color:#ffca28;">LOW STOCK (SHOPIFY)</p>
      <span class="prod-stage-count" id="pcnt-lowstock" style="background:#2a2200;color:#ffca28;">-</span>
      <span class="prod-stage-chevron open" id="pchv-lowstock">&#x25BE;</span>
    </div>
    <div class="prod-stage-body" id="lowstock-body" style="display:block;">
      <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Open PO's -->
  <div class="section-label" style="margin-top:20px;">Open PO's</div>
  <div class="prod-half-row">

    <div class="prod-stage" id="pstage-po-submit">
      <div class="prod-stage-header" style="background:#2a0f0f;cursor:pointer;" onclick="toggleOpenPoSection('submit')">
        <span style="font-size:15px;">&#x1F534;</span>
        <p class="prod-stage-title" style="color:#ef5350;">NEED TO SUBMIT</p>
        <span class="prod-stage-count" id="pcnt-po-submit" style="background:#3a1010;color:#ef5350;">-</span>
        <button type="button" class="btn" style="margin-left:auto;padding:3px 10px;font-size:11px;" onclick="event.stopPropagation();openAddItemModal('openpo')">+ Add PO</button>
        <span class="prod-stage-chevron open" id="pchv-po-submit">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="openpo-submit-body" style="display:block;">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="prod-stage" id="pstage-po-progress">
      <div class="prod-stage-header" style="background:#0a1f0a;cursor:pointer;" onclick="toggleOpenPoSection('progress')">
        <span style="font-size:15px;">&#x1F7E2;</span>
        <p class="prod-stage-title" style="color:#66bb6a;">IN PROGRESS</p>
        <span class="prod-stage-count" id="pcnt-po-progress" style="background:#0f2a0f;color:#66bb6a;">-</span>
        <span class="prod-stage-chevron open" id="pchv-po-progress">&#x25BE;</span>
      </div>
      <div class="prod-stage-body" id="openpo-progress-body" style="display:block;">
        <div style="padding:18px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </div>

  </div>

</div><!-- end .prod-main -->

<!-- ===== TASK / OPEN PO MODAL ===== -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-title" id="task-modal-title">New Item</div>

    <label>Section</label>
    <select id="task-section" onchange="updateItemFields()">
      <option value="shipping">Shipping</option>
      <option value="shop">Shop</option>
      <option value="sme">Sales / Marketing</option>
      <option value="engineering">Engineering</option>
      <option value="needtomake">Need to Make</option>
      <option value="openpo">Open PO's</option>
    </select>

    <label id="task-title-label">Title</label>
    <input type="text" id="task-title" placeholder="e.g. Order more powder coat hooks">

    <div id="task-desc-wrap">
      <label>Description (optional)</label>
      <textarea id="task-desc" placeholder="Additional details..."></textarea>
    </div>

    <div id="task-assigned-outer-wrap">
      <label>Assigned To (optional)</label>
      <div id="task-assigned-wrap">
        <select id="task-assigned" style="width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 12px;font-size:13px;color:#e0e0e0;outline:none;font-family:inherit;margin-top:4px;">
          <option value="">— Unassigned —</option>
        </select>
      </div>
    </div>

    <div id="task-due-wrap">
      <label>Due Date (optional)</label>
      <input type="hidden" id="task-due" value="">
      <button type="button" class="date-input-btn" data-picker-target="task-due">
        <span style="color:#333;">Select date...</span>
        <span style="color:#555;font-size:12px;"> &#x1F4C5;</span>
      </button>
    </div>

    <div id="task-priority-wrap">
      <label>Priority (optional)</label>
      <input type="hidden" id="task-priority" value="">
      <div class="priority-select-row">
        <button type="button" class="priority-btn task-priority-btn" data-priority="low" onclick="setPriority('low')">Low</button>
        <button type="button" class="priority-btn task-priority-btn" data-priority="medium" onclick="setPriority('medium')">Medium</button>
        <button type="button" class="priority-btn task-priority-btn" data-priority="high" onclick="setPriority('high')">High</button>
      </div>
    </div>

    <div id="po-fields-wrap" style="display:none;">
      <label>Vendor (optional)</label>
      <input type="text" id="po-vendor" placeholder="e.g. Acme Supply Co.">

      <label>PO # (optional)</label>
      <input type="text" id="po-num" placeholder="e.g. PO-12345">

      <label>Status</label>
      <select id="po-status" onchange="updatePoStatusFields()">
        <option value="need_to_submit">Need to Submit</option>
        <option value="in_progress">In Progress</option>
      </select>

      <div id="po-priority-wrap">
        <label>Priority</label>
        <input type="hidden" id="po-priority" value="">
        <div class="priority-select-row">
          <button type="button" class="priority-btn po-priority-btn" data-priority="low" onclick="setPoPriority('low')">Low</button>
          <button type="button" class="priority-btn po-priority-btn" data-priority="medium" onclick="setPoPriority('medium')">Medium</button>
          <button type="button" class="priority-btn po-priority-btn" data-priority="high" onclick="setPoPriority('high')">High</button>
        </div>
      </div>

      <div id="po-duedate-wrap">
        <label>Due Date (optional)</label>
        <input type="hidden" id="po-duedate" value="">
        <button type="button" class="date-input-btn" data-picker-target="po-duedate">
          <span style="color:#333;">Select date...</span>
          <span style="color:#555;font-size:12px;"> &#x1F4C5;</span>
        </button>
      </div>

      <div id="po-eta-wrap" style="display:none;">
        <label>ETA (optional)</label>
        <input type="hidden" id="po-eta" value="">
        <button type="button" class="date-input-btn" data-picker-target="po-eta">
          <span style="color:#333;">Select date...</span>
          <span style="color:#555;font-size:12px;"> &#x1F4C5;</span>
        </button>
      </div>
    </div>

    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" onclick="closeTaskModal()">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="confirmTaskSave()">Save</button>
    </div>
  </div>
</div>

<!-- ===== DATE PICKER MODAL ===== -->
<div class="modal-overlay" id="date-picker-modal">
  <div class="modal" style="max-width:340px;">
    <div id="picker-body"></div>
    <div class="modal-btns" style="margin-top:12px;">
      <button class="modal-btn modal-btn-cancel" onclick="closeDatePicker()">Cancel</button>
      <button class="modal-btn" style="background:#1a1a1a;color:#555;" onclick="selectDate('');closeDatePicker()">Clear</button>
    </div>
  </div>
</div>

</div><!-- end .app-content -->
</div><!-- end .app-shell -->

<!-- ===== SCRIPTS ===== -->
<script src="js/supabase.js"></script>
<script src="js/auth.js?v=1782237766"></script>
<script src="js/activity-log-helper.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/calendar.js"></script>
<script src="js/production.js?v=1782237770"></script>
<script>
  var _sess = requireAuth();
  initAvatarDropdown();
  renderAvatar(_sess);
  renderHeader({ title: 'PRODUCTION', buttons: '<button class="btn btn-green" onclick="openAddItemModal()">+ ADD ITEM</button><button class="btn" onclick="loadTasks();loadOpenPOs();">&#x21BB; Refresh</button>' });
  renderSidebar('production');
  initProdSections();
  initDatePickers();

  if (localStorage.getItem('cw_theme') === 'light') {
    document.body.classList.add('light-mode');
    var tb = document.getElementById('theme-btn');
    if (tb) tb.textContent = '☾';
  }

  // Fetch profile then show welcome and load tasks
  fetchProfile(_sess, function (sess) {
    _sess = sess;
    renderAvatar(_sess);

    // Welcome message - use full_name, fall back to first part of email
    var _rawName = _sess.full_name || (_sess.user && _sess.user.email) || 'there';
    var _wName = _rawName.indexOf('@') !== -1 ? _rawName.split('@')[0] : _rawName.split(' ')[0];
    var _wDays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var _wMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var _wNow = new Date();
    var _wDate = _wDays[_wNow.getDay()] + ', ' + _wMonths[_wNow.getMonth()] + ' ' + _wNow.getDate() + ', ' + _wNow.getFullYear();
    var _wBar = document.getElementById('welcome-bar');
    var _wMsg = document.getElementById('welcome-msg');
    if (_wMsg) _wMsg.innerHTML = "&#x1F44B; Welcome back, <strong>" + _wName + "</strong>! It's " + _wDate + ". Let's kick some ass today!";
    if (_wBar) _wBar.style.display = 'block';

    initAssigneeFilter();
    loadProdUsers(function() {
      loadTasks();
    });
    loadLowStock();
    loadOpenPOs();
  });
</script>

<div class="banner" id="banner"></div>
</body>
</html>
